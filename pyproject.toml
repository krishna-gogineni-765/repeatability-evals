[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repeatability-evals"
version = "0.1.0"
description = "Consistency evals for non-deterministic systems: LLM generation, agentic retrieval, agent workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Krishna Gogineni" }]
keywords = ["llm", "evaluation", "consistency", "repeatability", "non-determinism", "rag", "retrieval", "agents", "reliability", "llm-as-judge"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []  # core is pure standard library

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/repeatability_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional/List for py3.9 readability

[project.urls]
Homepage = "https://github.com/krishna-gogineni-765/repeatability-evals"
Issues = "https://github.com/krishna-gogineni-765/repeatability-evals/issues"
