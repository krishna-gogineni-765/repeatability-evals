[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consistency-evals"
version = "0.1.0"
description = "Composable tools for measuring how consistent repeated or perturbed runs of an LLM system are."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Krishna Gogineni" }]
keywords = ["llm", "evaluation", "consistency", "rag", "reliability", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []  # core is pure standard library

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional/List for py3.9 readability
